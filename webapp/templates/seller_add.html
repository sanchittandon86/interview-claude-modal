{% extends "base.html" %}
{% block title %}Add Product{% endblock %}
{% block content %}
  <h1>Add New Product (US-1)</h1>

  {% if error %}
    <div class="alert error">{{ error }}</div>
  {% endif %}

  <form method="post" action="{{ url_for('seller_add_product') }}" class="form">
    <label>Seller ID <input type="text" name="seller_id" required></label>
    <label>Product Name <input type="text" name="name"></label>
    <label>Category <input type="text" name="category"></label>
    <label>Price (₹) <input type="number" step="0.01" name="price"></label>
    <label>Stock Quantity <input type="number" name="stock_quantity"></label>
    <label>Attribute Name (optional, for facets) <input type="text" name="attr_key" placeholder="e.g. color"></label>
    <label>Attribute Value <input type="text" name="attr_value" placeholder="e.g. Blue"></label>
    <button type="submit">Add Product</button>
  </form>
  <p class="muted">Leaving Name, Category, Price, or Stock Quantity blank will trigger a validation error (TC-1.2 / TC-1.3).</p>
{% endblock %}
