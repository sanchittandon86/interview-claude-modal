{% extends "base.html" %}
{% block title %}Edit Product{% endblock %}
{% block content %}
  <h1>Update Product (US-2)</h1>

  {% if error %}
    <div class="alert error">{{ error }}</div>
  {% endif %}

  {% if product %}
  <form method="post" class="form">
    <label>Name <input type="text" name="name" value="{{ product.name }}"></label>
    <label>Category <input type="text" name="category" value="{{ product.category }}"></label>
    <label>Price (₹) <input type="number" step="0.01" name="price" value="{{ product.price }}"></label>
    <label>Stock Quantity <input type="number" name="stock_quantity" value="{{ product.stock_quantity }}"></label>
    <button type="submit">Save Changes</button>
  </form>
  {% elif not error %}
  <p>Product "{{ product_id }}" was not found.</p>
  {% endif %}

  <p><a href="{{ url_for('seller_products') }}">Back to inventory</a></p>
{% endblock %}
